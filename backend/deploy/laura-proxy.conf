# Règles de proxy vers le conteneur Laura (LAURA_PORT, défaut 8050).
#
# Fichier inclus par /etc/nginx/sites-available/laura.labeltechnology.mg. Il est séparé exprès : le
# bloc server est réécrit par certbot (certificat, listen 443, redirection), et
# le réinstaller écraserait ce travail. Ici on ne touche qu'aux locations, donc
# ce fichier peut être recopié à volonté sans jamais casser HTTPS :
#
#   sudo cp ~/laura/laura-proxy.conf /etc/nginx/snippets/laura-proxy.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# X-Forwarded-For est écrasé ($remote_addr) et non complété
# ($proxy_add_x_forwarded_for) : quotas.ip_client lit la première adresse, qui
# ne doit donc pas pouvoir venir du client. Les en-têtes sont répétés dans
# chaque location — nginx n'hérite pas des proxy_set_header du bloc parent dès
# qu'une location en définit un.

location /ws/ {
    proxy_pass http://127.0.0.1:8050;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /ws/equipe reste ouvert sans trafic tant qu'aucune alerte ne tombe, et
    # /ws/chat pendant toute la visite. Le défaut de 60 s couperait les deux.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location / {
    proxy_pass http://127.0.0.1:8050;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Nécessaire le jour où l'on remplacerait le WebSocket par du SSE : sans
    # cela nginx accumule la réponse et la livre d'un bloc à la fin. Le
    # streaming marcherait en local et disparaîtrait en production. Sans effet
    # sur les réponses JSON courtes.
    proxy_buffering off;
    proxy_cache off;
}
